name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "muster::release"
    runs-on: ubuntu-latest
    steps:
      # A push only runs on main; a manual run must not publish another branch.
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases publish from main only, not $GITHUB_REF" >&2
          exit 1

      # No token in .git/config while dependency build scripts run: the
      # release step takes GITHUB_TOKEN through GH_TOKEN, and the release
      # branch push its deploy key. Actions are pinned by commit, as this job
      # can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check version change
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # `[package]` too: the manifest before the workspace split kept it there.
          version_of() { awk '/^\[(workspace\.)?package\]/{s=1;next} /^\[/{s=0} s && /^version/{gsub(/.*= *"|".*/,"");print;exit}'; }
          NEW=$(version_of < Cargo.toml)
          [ -n "$NEW" ] || { echo "no version in Cargo.toml" >&2; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_VERSION" != "$NEW" ]; then
              echo "Requested version $DISPATCH_VERSION does not match Cargo.toml version $NEW" >&2
              exit 1
            fi

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed read must stop the run, never look like a version change.
          OLD=$(git show HEAD~1:Cargo.toml | version_of)
          [ -n "$OLD" ] || { echo "no version in the previous commit's Cargo.toml" >&2; exit 1; }
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          fi

      # The release branch, which `muster mcp add` installs the plugin from,
      # gets the plugin of the version it publishes: `just bump` sets both
      # manifests, and a bump made without it must not ship a stale plugin.
      - name: Check the plugin's version
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          listed=$(jq -r '.plugins[] | select(.name == "muster") | .version' .claude-plugin/marketplace.json)
          own=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          if [ "$listed" != "$VERSION" ] || [ "$own" != "$VERSION" ]; then
            echo "The plugin is at $own, listed as $listed, not $VERSION; run just bump" >&2
            exit 1
          fi

      # A tag already on another commit must never be taken for this release's.
      - name: Refuse a release tag on another commit
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(git ls-remote --tags origin)
          tagged=$(awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" {peeled = $1} $2 == ref {plain = $1} END {print (peeled ? peeled : plain)}' <<< "$tags")
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG is on $tagged, not on $GITHUB_SHA; refusing to publish" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: steps.version.outputs.changed == 'true'

      # Before any upload. Trusted Publishing cannot create a crate name, so a
      # crate crates.io has never seen fails the run here; AGENTS.md's "First
      # release of the split crates" says how to publish one by hand. A crate
      # already at this version is skipped, so a run that stopped half way
      # finishes on a re-run. A lookup crates.io does not answer with 200 or
      # 404 is retried, then fails the run: it never counts as unpublished.
      - name: Look up every crate on crates.io
        if: steps.version.outputs.changed == 'true'
        id: lookup
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LOOKUP_ATTEMPTS: 5
          LOOKUP_RETRY_SECONDS: 10
          LOOKUP_TIMEOUT_SECONDS: 20
        shell: bash
        run: |
          set -euo pipefail
          status_of() {
            local url=$1 attempt code
            for attempt in $(seq "$LOOKUP_ATTEMPTS"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time "$LOOKUP_TIMEOUT_SECONDS" \
                -A "muster release (https://github.com/sagoez/muster)" "$url" || true)
              if [ "$code" = 200 ] || [ "$code" = 404 ]; then
                echo "$code"
                return 0
              fi
              echo "crates.io answered $url with '$code' (attempt $attempt)" >&2
              sleep "$LOOKUP_RETRY_SECONDS"
            done
            echo "crates.io did not answer $url after $LOOKUP_ATTEMPTS attempts" >&2
            return 1
          }
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          # An empty list would publish nothing and still tag the release.
          [ -n "$crates" ] || { echo "cargo metadata named no crate" >&2; exit 1; }
          missing=()
          exclude=()
          for crate in $crates; do
            code=$(status_of "https://crates.io/api/v1/crates/$crate")
            if [ "$code" = 404 ]; then
              missing+=("$crate")
              continue
            fi
            code=$(status_of "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$code" = 200 ]; then
              exclude+=(--exclude "$crate")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Not on crates.io yet: ${missing[*]}. Publish each once by hand first; see \"First release of the split crates\" in AGENTS.md." >&2
            exit 1
          fi
          echo "exclude=${exclude[*]}" >> "$GITHUB_OUTPUT"
          echo "pending=$(( $(echo "$crates" | wc -w) - ${#exclude[@]} / 2 ))" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.version.outputs.changed == 'true' && steps.lookup.outputs.pending != '0'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish to crates.io
        if: steps.version.outputs.changed == 'true' && steps.lookup.outputs.pending != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDE: ${{ steps.lookup.outputs.exclude }}
        run: |
          read -r -a exclude <<< "$EXCLUDE"
          cargo publish --workspace --locked "${exclude[@]}"

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `muster mcp add` installs the plugin from the `release` branch, so it
      # moves only once the crates and the tag are out. The "Release branch"
      # ruleset lets only deploy keys write it, so the push goes over SSH with
      # RELEASE_DEPLOY_KEY, never GITHUB_TOKEN. A plain push creates the
      # branch on the first release and refuses anything but a fast-forward.
      - name: Fast-forward the release branch
        if: steps.version.outputs.changed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/release_deploy_key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git push git@github.com:sagoez/muster.git "$GITHUB_SHA:refs/heads/release"
