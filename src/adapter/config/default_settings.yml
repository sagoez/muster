desktop_notifications: true

# Terminal size a process starts with, before any attached client resizes it:
# 1 to 1000 rows by 2 to 2000 columns.
default_size:
  rows: 24
  cols: 80

# The key that detaches `muster attach` from a process: a Control chord of a
# letter, \ or ].
detach_key: "ctrl-\\"

# Size at which a process's output log rotates; one older log is kept.
log_max_size: 10MiB

# Lines of scrollback each process's terminal keeps.
scrollback: 1000

# The default colors a process's terminal reports when an agent asks for them,
# so it themes for your terminal: dark or light.
color_scheme: dark
