name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories land without any change here, so main is audited daily too.
  schedule:
    - cron: "17 6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fails on a vulnerability, an unsound or a yanked crate; .cargo/audit.toml
  # holds the policy and the exemptions. `just audit` runs the same.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit@0.23.0

      - name: Audit
        run: cargo audit

  check:
    if: github.event_name != 'schedule'
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # rustfmt.toml uses unstable import options, so formatting runs on nightly.
      - name: Format
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features

      # Each crate on its own, so none builds only because a sibling turned a
      # feature on for the whole workspace. `just lint-crates` runs the same.
      - name: Clippy per crate
        shell: bash
        run: |
          set -euo pipefail
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          [ -n "$crates" ] || { echo "cargo metadata named no crate" >&2; exit 1; }
          for crate in $crates; do
            cargo +stable clippy -p "$crate" --all-targets -- -D warnings
          done

      - name: Test
        run: cargo +stable test --workspace --all-features

      - name: Package
        if: matrix.os == 'ubuntu-latest'
        # Verifying resolves siblings from crates.io; the release's `cargo publish` verifies each crate against its freshly published siblings in order.
        run: cargo +stable package --workspace --locked --no-verify

  # The view page in a real browser against a fake stream. `just page-test`
  # runs the same.
  page:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muster-web/page-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: muster-web/page-tests/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npx playwright test
