[package]
name = "muster-os"
description = "Internal crate of muster-workspace: unix helpers: private state and socket directories, process groups and signals, detached spawns, bounded reads. No stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src/**", "/LICENSE"]

[dependencies]
muster-domain = { workspace = true }

directories = { workspace = true }
nutype = { workspace = true }
rustix = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }

[dependencies.libc]
workspace = true
optional = true

[dependencies.tempfile]
workspace = true
optional = true

[features]
# Test fixtures other crates' tests share; enable only from dev-dependencies.
testing = ["dep:libc", "dep:tempfile"]

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }
