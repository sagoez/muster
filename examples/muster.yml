# muster stack: `muster import` loads it into a project.
version: 1
processes:
  - name: web
    command: npm run dev
    working_dir: frontend
    description: Vite dev server
    environment:
      PORT: "5173"
    autostart: true
    restart: on-failure
    stop:
      signal: terminate
      grace_period: 5s
    ready:
      http: http://localhost:5173/
      timeout: 60s
    ports:
      - 5173
  - name: worker
    command: bin/worker
    autostart: false
    restart: always
    stop:
      signal: interrupt
      grace_period: 10s
