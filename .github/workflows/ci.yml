name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      # rustfmt.toml uses unstable import options, so formatting runs on nightly.
      - name: Format
        run: cargo +nightly fmt --all --check

      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features

      # Each crate on its own, so none builds only because a sibling turned a
      # feature on for the whole workspace. `just lint-crates` runs the same.
      - name: Clippy per crate
        run: |
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            cargo +stable clippy -p "$crate" --all-targets -- -D warnings
          done

      - name: Test
        run: cargo +stable test --workspace --all-features

      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: cargo +stable package --workspace --locked
