[package]
name = "muster-protocol"
description = "Internal crate of muster-workspace: what its service, holders and clients exchange (wire DTOs, framed IPC, the service protocol, the process log format). No stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
include = ["/src/**", "/LICENSE"]

[dependencies]
muster-domain = { workspace = true }
muster-os = { workspace = true }
muster-terminal = { workspace = true }

atomic-write-file = { workspace = true }
bytesize = { workspace = true }
crossbeam-channel = { workspace = true }
getset = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
libc = { workspace = true }
nutype = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
typed-builder = { workspace = true }
uuid = { workspace = true }

[dependencies.tempfile]
workspace = true
optional = true

[features]
# Test fixtures other crates' tests share; enable only from dev-dependencies.
testing = ["dep:tempfile"]

[dev-dependencies]
muster-domain = { workspace = true, features = ["testing"] }
muster-os = { workspace = true, features = ["testing"] }
muster-terminal = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
