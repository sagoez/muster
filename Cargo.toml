[workspace]
members = [
    "muster-application",
    "muster-client",
    "muster-domain",
    "muster-herdr",
    "muster-holder",
    "muster-mcp",
    "muster-os",
    "muster-protocol",
    "muster-service",
    "muster-store",
    "muster-terminal",
    "muster-workspace",
]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/sagoez/muster"
readme = "README.md"

[workspace.dependencies]
# Workspace crates; AGENTS.md says why each one is a crate. Each pins the
# exact sibling version: they have no stable API of their own.
muster-application = { path = "muster-application", version = "=0.11.0" }
muster-client = { path = "muster-client", version = "=0.11.0" }
muster-domain = { path = "muster-domain", version = "=0.11.0" }
muster-herdr = { path = "muster-herdr", version = "=0.11.0" }
muster-holder = { path = "muster-holder", version = "=0.11.0" }
muster-mcp = { path = "muster-mcp", version = "=0.11.0" }
muster-os = { path = "muster-os", version = "=0.11.0" }
muster-protocol = { path = "muster-protocol", version = "=0.11.0" }
muster-service = { path = "muster-service", version = "=0.11.0" }
muster-store = { path = "muster-store", version = "=0.11.0" }
muster-terminal = { path = "muster-terminal", version = "=0.11.0" }

alacritty_terminal = "0.26"
anstream = "1.0.0"
anstyle = "1.0.14"
atomic-write-file = "0.3.0"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
cliclack = "0.5.6"
console = "0.16.4"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
getset = "0.1.7"
humantime = "2.4.0"
humantime-serde = "1.1.1"
insta = "1.48.0"
libc = "0.2.186"
listeners = "0.6.1"
notify-rust = "4.11.7"
nutype = { version = "0.7.0", features = ["serde"] }
portable-pty = "0.9.0"
regex = "1.13.1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio", "termios"] }
schemars = "1.2.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
shlex = "2"
signal-hook = "0.4.5"
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
typed-builder = "0.23.2"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.4"
unicode-width = "0.2.2"
ureq = { version = "3.5.0", default-features = false }
uuid = { version = "1.18.1", features = ["v4"] }
