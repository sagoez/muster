name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "muster::release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          # `[package]` too: the manifest before the workspace split kept it there.
          version_of() { awk '/^\[(workspace\.)?package\]/{s=1;next} /^\[/{s=0} s && /^version/{gsub(/.*= *"|".*/,"");print;exit}'; }
          NEW=$(version_of < Cargo.toml)

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_VERSION" != "$NEW" ]; then
              echo "Requested version $DISPATCH_VERSION does not match Cargo.toml version $NEW" >&2
              exit 1
            fi

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD=$(git show HEAD~1:Cargo.toml | version_of)
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.changed == 'true'

      - name: Authenticate with crates.io
        if: steps.version.outputs.changed == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Skips every crate already at this version, so a run that stopped half
      # way finishes on a re-run.
      - name: Publish to crates.io
        if: steps.version.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          exclude=()
          pending=0
          for crate in $crates; do
            if curl -sf -o /dev/null -A "muster release (https://github.com/sagoez/muster)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              exclude+=(--exclude "$crate")
            else
              pending=$((pending + 1))
            fi
          done
          if [ "$pending" -eq 0 ]; then
            echo "every crate is already at $VERSION"
          else
            cargo publish --workspace --locked "${exclude[@]}"
          fi

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
